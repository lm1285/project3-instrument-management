<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Excel 智能填充助手 V3</title>
    <!-- Office.js -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <style>
        :root {
            --primary: #0078d4;
            --primary-hover: #106ebe;
            --bg-body: #f3f2f1;
            --bg-card: #ffffff;
            --text-primary: #323130;
            --text-secondary: #605e5c;
            --border-color: #edebe9;
            --success: #107c10;
            --warning: #797775;
            --error: #a80000;
            --shadow-card: 0 1.6px 3.6px 0 rgba(0,0,0,0.132);
            --radius: 4px;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        header {
            background: var(--bg-card);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
        }
        header .status {
            font-size: 11px;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Main Content */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        /* Card Component */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            padding: 12px;
            margin-bottom: 12px;
        }
        
        /* Action Button */
        .btn-action {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-action:hover { background: var(--primary-hover); }
        .btn-action:disabled { background: var(--text-secondary); cursor: not-allowed; }
        .btn-secondary { background: white; color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--bg-body); }

        /* Task Tree */
        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .task-item {
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            margin-bottom: 8px;
            background: #faf9f8;
            overflow: hidden;
        }
        .task-header {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            cursor: pointer;
        }
        .task-header:hover { background: #f3f2f1; }
        .task-title { font-weight: 600; font-size: 12px; }
        .task-meta { font-size: 10px; color: var(--text-secondary); }
        
        .task-body {
            padding: 8px 12px;
            border-top: 1px solid var(--border-color);
            display: none; /* Hidden by default */
        }
        .task-item.expanded .task-body { display: block; }

        .tag {
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
        }
        .tag-std { background: #e6f2ff; color: #0078d4; }
        .tag-imp { background: #fff4ce; color: #797775; }

        /* Logs */
        #log-area {
            font-family: monospace;
            font-size: 10px;
            color: var(--text-secondary);
            max-height: 100px;
            overflow-y: auto;
            background: #f3f2f1;
            padding: 8px;
            border-radius: var(--radius);
            margin-top: auto; /* Push to bottom */
        }
        .log-entry { margin-bottom: 2px; }
        .log-info { color: var(--text-primary); }
        .log-warn { color: #d83b01; }
        .log-success { color: var(--success); }

        /* Spinner */
        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            width: 12px;
            height: 12px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body class="ms-font-m ms-welcome">
    
    <header>
        <h1>Excel 智能填充 V3</h1>
        <div id="connection-status" class="status">● Ready</div>
    </header>

    <main>
        <!-- Step 1: Table Recognition -->
        <div class="card">
            <div style="margin-bottom: 8px;">
                <h3 style="margin:0; font-size:14px;">1. 表格识别</h3>
                <span style="font-size:11px; color:#666;">自动检测多标题及数据区域</span>
            </div>
            <button id="btn-recognize" class="btn-action">
                <span>🔍 智能识别表格</span>
            </button>
            <div id="recognition-result" style="margin-top: 8px; font-size: 11px; color: var(--success); display: none;">
                识别成功！检测到以下表格：
            </div>
            <ul id="table-list" class="task-list" style="margin-top: 8px; display: none;">
                <!-- 动态生成的表格列表 -->
            </ul>
        </div>

        <!-- Step 2: Random Number Generation -->
        <div class="card">
            <div style="margin-bottom: 8px;">
                <h3 style="margin:0; font-size:14px;">2. 数据自动生成</h3>
                <span style="font-size:11px; color:#666;">基于技术要求/允差自动生成模拟数据</span>
            </div>
            <button id="btn-generate-all" class="btn-action" style="margin-bottom: 8px;">
                <span>⚡ 一键填充所有表格</span>
            </button>
            <div style="font-size: 12px; padding-top: 8px; border-top: 1px solid var(--border-color);">
                <label>
                    <input type="checkbox" id="chk-auto-generate" checked> 开启实时监听 (当输入等级时自动生成)
                </label>
                <button id="btn-toggle-listener" class="btn-secondary" style="width: 100%; padding: 6px; border-radius: 4px; cursor: pointer; margin-top: 8px;">
                    <span>启动实时监听</span>
                </button>
            </div>
        </div>

        <!-- Step 3: Data Sync -->
        <div class="card">
            <div style="margin-bottom: 8px;">
                <h3 style="margin:0; font-size:14px;">3. 数据同步与配置</h3>
                <span style="font-size:11px; color:#666;">云端规则同步及多用户协同</span>
            </div>
            <button id="btn-sync" class="btn-secondary" style="width: 100%; padding: 6px; border-radius: 4px; cursor: pointer;">
                <span>☁️ 同步云端配置</span>
            </button>
        </div>

    </main>

    <!-- Console Log Area -->
    <div style="padding: 0 16px 16px 16px;">
        <div id="log-area"></div>
    </div>

    <!-- Scripts -->
    <script src="scripts/taskpane.js" type="text/javascript"></script>
</body>
</html>
