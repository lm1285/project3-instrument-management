    <g class="sans small">
      <line x1="1160" y1="606" x2="1536" y2="606" stroke="#edf1f5"/><line x1="1160" y1="644" x2="1536" y2="644" stroke="#edf1f5"/><line x1="1160" y1="682" x2="1536" y2="682" stroke="#edf1f5"/>
      <text x="1181" y="594" text-anchor="middle" class="muted">1</text><text x="1220" y="594" class="ink">设备编号</text><rect x="1358" y="581" width="94" height="22" rx="5" fill="#eaf4ff"/><text x="1405" y="596" text-anchor="middle" class="blue">设备编号</text><circle cx="1498" cy="592" r="4" fill="#18a77d"/>
      <text x="1181" y="632" text-anchor="middle" class="muted">2</text><text x="1220" y="632" class="ink">仪器名称</text><rect x="1358" y="619" width="94" height="22" rx="5" fill="#edf8f4"/><text x="1405" y="634" text-anchor="middle" class="green">仪器名称</text><circle cx="1498" cy="630" r="4" fill="#18a77d"/>
      <text x="1181" y="670" text-anchor="middle" class="muted">3</text><text x="1220" y="670" class="ink">检定日期</text><rect x="1358" y="657" width="94" height="22" rx="5" fill="#fff4e2"/><text x="1405" y="672" text-anchor="middle" class="orange">待配置</text><circle cx="1498" cy="668" r="4" fill="#e29a2d"/>
      <text x="1181" y="708" text-anchor="middle" class="muted">4</text><text x="1220" y="708" class="ink">证书编号</text><text x="1405" y="708" text-anchor="middle" class="muted">证书编号</text><circle cx="1498" cy="706" r="4" fill="#18a77d"/>
    </g>
    <rect x="1160" y="742" width="376" height="92" rx="9" fill="#f7fbff" stroke="#d9e7f5"/>
    <text x="1182" y="770" class="sans ink" font-size="14" font-weight="700">校验结果</text>
    <text x="1182" y="797" class="sans green small">✓　源字段均已识别</text><text x="1340" y="797" class="sans green small">✓　无重复映射</text>
    <text x="1182" y="820" class="sans orange small">!　仍有 2 项待配置</text>
