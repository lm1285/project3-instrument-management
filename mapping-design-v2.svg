        <rect x="672" y="862" width="322" height="32" rx="7" fill="#fff" stroke="#c8d7e8"/><text x="687" y="883" class="ink body">证书编号</text><text x="964" y="883" class="muted">⌄</text><circle cx="1024" cy="878" r="4" fill="#18a77d"/><text x="1035" y="883" class="green small">已匹配</text>
