    <style>
      .sans{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',Arial,sans-serif}
      .serif{font-family:'Times New Roman','SimSun',serif}
      .ink{fill:#172b4d}.muted{fill:#6b7e99}.blue{fill:#1677ff}.green{fill:#14966e}.orange{fill:#c77a17}
      .label{font-size:13px;font-weight:600;letter-spacing:.2px}.body{font-size:14px}.small{font-size:12px}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f4f7fb"/>
  <rect x="0" y="0" width="88" height="1000" fill="#123f78"/>
  <rect x="18" y="18" width="52" height="52" rx="13" fill="#2f80ed"/>
  <text x="44" y="52" text-anchor="middle" class="sans" font-size="28" font-weight="700" fill="#fff">仪</text>
  <g class="sans" fill="#d9e8ff" text-anchor="middle">
    <text x="44" y="122" font-size="22">⌂</text>
    <text x="44" y="181" font-size="22">☷</text>
