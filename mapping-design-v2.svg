    <text x="122" y="95" class="serif ink" font-size="30" font-weight="700">映射关系</text>
    <text x="122" y="125" class="sans muted" font-size="14">配置模板字段之间的对应关系，保存后用于一键转送</text>
    <g class="sans" font-size="14" font-weight="600">
