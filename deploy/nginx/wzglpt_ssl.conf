server {
    listen 80;
    server_name wzglpt.top www.wzglpt.top;
    # 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name wzglpt.top www.wzglpt.top;

    # 阿里云部署的证书路径
    ssl_certificate /etc/nginx/cert/wzglpt.top.pem;
    ssl_certificate_key /etc/nginx/cert/wzglpt.top.key;

    # SSL 优化配置
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/wzglpt;
    index index.html;
    client_max_body_size 100m;
    access_log /var/log/nginx/wzglpt-access.log;
    error_log /var/log/nginx/wzglpt-error.log warn;

    # 前端静态资源缓存
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # 后端 API 代理 (端口修正为 3002)
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # 禁止缓存 index.html，确保用户获取最新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 前端路由支持 (SPA)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }
}
